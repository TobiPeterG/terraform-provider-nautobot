services:
  testrunner:
    build:
      context: ./test
      dockerfile: Dockerfile
      target: ${TF_TARGET}
      args:
        TF_VERSION: ${TF_VERSION}
    depends_on:
      nautobot:
        condition: service_healthy
    working_dir: /workspace
    volumes:
      - ./:/workspace:rw
      - go_build_cache:/root/.cache/go-build
      - go_mod_cache:/go/pkg/mod
      - tf_plugin_cache:/workspace/.terraform.d/plugin-cache
    environment:
      TF_ACC: "1"
      TF_PLUGIN_CACHE_DIR: "/workspace/.terraform.d/plugin-cache"

volumes:
  go_build_cache: {}
  go_mod_cache: {}
  tf_plugin_cache: {}
