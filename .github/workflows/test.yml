name: Tests
on:
  pull_request:
    paths-ignore:
      - "README.md"
  push:
    paths-ignore:
      - "README.md"
  # schedule:
  #   - cron: "0 13 * * *"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Get dependencies
        run: go mod download

      - name: Build
        run: make build

  generate:
    name: Generate
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Get dependencies
        run: go mod download

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.2"
          terraform_wrapper: false

      - name: Generate
        run: go generate ./...

      - name: git diff
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference in directories after code generation. Run 'go generate ./...' command and commit."; exit 1)

  test:
    name: Acceptance (Terraform/OpenTofu)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - tool: terraform
            version: "1.14.2"
          - tool: opentofu
            version: "1.12.3"

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run acceptance tests via Docker Compose
        env:
          TF_TOOL: ${{ matrix.tool }}
          TF_VERSION: ${{ matrix.version }}
          NAUTOBOT_VER: "3.0.2"
          PYTHON_VER: "3.12"
        run: make testacc-docker

      - name: Dump Nautobot logs on failure
        if: failure()
        run: |
          docker compose --project-directory . \
            -f test/nautobot/docker-compose.yml \
            logs --no-color --timestamps

      - name: Tear down
        if: always()
        run: make testacc-docker-down